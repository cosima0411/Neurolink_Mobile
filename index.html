<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neurolink Mobile</title>
<style>
    * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        overflow: hidden;
        overscroll-behavior: none;
    }
    body {
        background-color: #050505;
        color: #e0e0e0;
        font-family: 'Courier New', Courier, monospace, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        height: 100dvh;
        margin: 0;
        padding: 15px;
    }
    #game-viewport {
        width: 100%;
        max-width: 420px;
        height: 740px;
        max-height: calc(100dvh - 30px);
        background-color: #000;
        border: 3px solid #222;
        border-radius: 20px;
        box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
        transition: all 0.3s ease;
    }
    /* 真正在手機瀏覽器開啟時，讓遊戲畫面撐滿整個螢幕，變成一個手機面板app，而不是縮在畫面中間的一個小方框 */
    @media (max-width: 480px) {
        body { padding: 0; }
        #game-viewport {
            max-width: 100%;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-height: 100dvh;
            border: none;
            border-radius: 0;
            box-shadow: none;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        #controls { max-height: 42dvh; }
    }

    #handheld-phone-bar {
        background-color: #111;
        padding: 12px 15px;
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        border-bottom: 2px solid #222;
        font-weight: bold;
        z-index: 10;
    }
    #handheld-phone-bar.stat-hidden, #inventory-bar.stat-hidden { display: none; }
    #temp-stat-wrap.stat-hidden { display: none; }
    .status-danger { color: #ff3333; animation: blink 0.8s infinite; }
    .status-warn { color: #ffcc00; }
    .status-good { color: #33cc33; }

    #inventory-bar {
        background-color: #0a0a0a;
        padding: 6px 15px;
        font-size: 11px;
        color: #888;
        border-bottom: 1px solid #1a1a1a;
        display: flex;
        justify-content: flex-end;
    }

    #story-container {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    .story-text {
        line-height: 1.7;
        font-size: 13.5px;
        white-space: pre-line;
        text-align: left;
    }

    .warning-text { color: #ff4444; font-weight: bold; }
    .glitch-text { color: #ff00ff; text-shadow: 1px 1px #00ffff; }
    .room-label { color: #666; font-size: 11px; letter-spacing: 2px; }

    #controls {
        padding: 15px;
        background-color: #0a0a0a;
        border-top: 1px solid #222;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 340px;
        overflow-y: auto;
    }
    button {
        background-color: #1a1a1a;
        color: #00ffcc;
        border: 1px solid #00ffcc;
        padding: 11px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
        text-align: left;
        font-family: inherit;
        touch-action: manipulation;
    }
    /* 只在真的有滑鼠可以 hover 的裝置上套用反白，避免手機點擊後殘留反白(手機的 :hover 會卡在最後點過的按鈕上) */
    @media (hover: hover) and (pointer: fine) {
        button:hover:not(:disabled) {
            background-color: #00ffcc;
            color: #000;
        }
    }
    button:active:not(:disabled) {
        background-color: #00ffcc;
        color: #000;
    }
    button:focus-visible { outline: 2px solid #00ffcc; outline-offset: 2px; }
    button:focus:not(:focus-visible) { outline: none; }
    button:disabled {
        border-color: #333;
        color: #555;
        cursor: not-allowed;
    }
    .btn-charge { touch-action: none; }
    .floor-header {
        color: #555;
        font-size: 11px;
        letter-spacing: 2px;
        margin-top: 6px;
        padding-left: 2px;
    }

    .light-on { background-color: #121218 !important; }
    .overheat-screen {
        border-color: #ff3333 !important;
        box-shadow: 0 0 50px rgba(255, 0, 0, 0.5) !important;
        animation: pulse-red 1.5s infinite alternate;
    }
    /* 怪物只剩最後一步就會追上時，整個畫面用比過熱更急促的紅色脈動警告 */
    .chase-critical {
        border-color: #ff2222 !important;
        box-shadow: 0 0 60px rgba(255, 0, 0, 0.75) !important;
        animation: pulse-chase 0.6s infinite alternate;
    }

    @keyframes blink { 50% { opacity: 0.3; } }
    @keyframes pulse-red {
        0% { background-color: #000; }
        100% { background-color: #1a0000; }
    }
    @keyframes pulse-chase {
        0% { background-color: #000; }
        100% { background-color: #2a0000; }
    }
    @media (prefers-reduced-motion: reduce) {
        .status-danger { animation: none; opacity: 1; }
        .overheat-screen { animation: none; background-color: #1a0000; }
        .chase-critical { animation: none; background-color: #2a0000; }
    }
</style>
</head>
<body>

<div id="game-viewport">
    <div id="handheld-phone-bar" class="stat-hidden">
        <span>電量：<span id="battery-display" class="status-good">⚡ 100%</span></span>
        <span id="temp-stat-wrap" class="stat-hidden">體溫：<span id="temp-display" class="status-good">🌡️ 36.5°C</span></span>
    </div>
    <div id="inventory-bar" class="stat-hidden">
        <span>道具：<span id="item-display">無</span></span>
    </div>

    <div id="story-container">
        <div id="room-label" class="room-label"></div>
        <div id="text-box" class="story-text"></div>
    </div>

    <div id="controls"></div>
</div>

<script>
    /* ============ 資料設定 ============ */
    const FLOORS = [
        { id: '3F',  name: '3F・控制與監視層', rooms: ['3F-A', '3F-B', '3F-C', '3F-D', '3F-E', '3F-F', '3F-G', '3F-H'] },
        { id: '2F',  name: '2F・通訊與訊號層', rooms: ['2F-A', '2F-B', '2F-C', '2F-D', '2F-E', '2F-F', '2F-G', '2F-H'] },
        { id: '1F',  name: '1F・表層辦公樓層', rooms: ['1F-A', '1F-B', '1F-C', '1F-D', '1F-E', '1F-F', '1F-G', '1F-H', '1F-I'] },
        { id: 'B1F', name: 'B1F・快取與備品層', rooms: ['B1F-A', 'B1F-B', 'B1F-C', 'B1F-D', 'B1F-E', 'B1F-F', 'B1F-G', 'B1F-H', 'B1F-I'] },
        { id: 'B2F', name: 'B2F・核心層', rooms: ['B2F-A', 'B2F-B', 'B2F-C', 'B2F-D', 'B2F-E', 'B2F-F', 'B2F-G', 'B2F-H'] }
    ];
    const ROOM_NAME = {
        '1F-A': '廢棄辦公室', '1F-B': '茶水間', '1F-C': '影印室',
        '1F-D': '接待大廳', '1F-E': '大會議室', '1F-F': '儲藏間', '1F-G': '洗手間', '1F-H': '樓梯間', '1F-I': '主管辦公室',
        'B1F-A': '數據快取室', 'B1F-B': '雜物儲藏室', 'B1F-C': '廢棄伺服器室',
        'B1F-D': '備品倉庫', 'B1F-E': '拆解工作台', 'B1F-F': '線材回收間', 'B1F-G': '緊急發電室', 'B1F-H': '清潔用品間', 'B1F-I': '維修工作台',
        'B2F-A': '配電室', 'B2F-B': '核心機房',
        'B2F-C': '冷卻機房', 'B2F-D': '管線維修間', 'B2F-E': '逃生梯井', 'B2F-F': '備援電池室', 'B2F-G': '警報控制室', 'B2F-H': '廢棄升降梯井',
        '2F-A': '基地台訊號室', '2F-B': '電話總機室',
        '2F-C': '廣播控制室', '2F-D': '資訊室', '2F-E': '配線間', '2F-F': '員工休息角', '2F-G': '影印機房', '2F-H': '訊號中繼室',
        '3F-A': '監控室', '3F-B': '頂樓機房',
        '3F-C': '警衛室', '3F-D': '值班休息室', '3F-E': '主機房', '3F-F': '文件室', '3F-G': '小會議室', '3F-H': '逃生梯間出口'
    };
    // 這批房間先不開放，門是鎖死的——留著給之後擴充或純粹當環境敘事的紅鯡魚
    const LOCKED_ROOMS = new Set(['3F-E', '3F-H', '2F-G', '1F-E', '1F-H', 'B1F-D', 'B1F-E', 'B1F-F', 'B1F-I', 'B2F-E', 'B2F-F']);
    const ROOM_FLOOR = {};
    FLOORS.forEach(f => f.rooms.forEach(r => ROOM_FLOOR[r] = f.id));
    const HEAT_THRESHOLD = 45.0; // 超過這個溫度，畫面才開始變紅、文字開始亂

    /* ============ 遊戲狀態 ============ */
    const CHASE_START_DISTANCE = 8;      // 追逐開始時的「距離」，歸零就被抓到(拉長一點，讓玩家有機會真的跑回配電室)
    const MONSTER_ATTRACT_ALERT = 4;     // 「注意力」累積到這裡，牠已經注意到你了(monsterAlert)
    const MONSTER_ATTRACT_CHASE = 8;     // 「注意力」累積到這裡，正式進入追逐狀態
    const MONSTER_ATTRACT_MAX = 10;
    const MONSTER_ATTRACT_DECAY = 0.15;  // 沒有斷電、沒有充電時，注意力每個行動自然衰減多少

    let gameState = {
        battery: 60,
        temp: 36.5,
        tempRevealed: false,
        corrupted: false,
        currentRoom: null,
        chargeTimer: null,
        observed: {},

        lightOn: false,
        hasIcepack: false,
        icepackTaken: false,
        antennaTried: false,
        serverNoteViews: 0,
        flashlightOn: false,

        doorUnlocked: false,
        doorCodeKnown: false,
        breakerTripped: false,

        waterDrinksLeft: 3,
        drawerUnlocked: false,
        alarmPulled: false,

        monsterBorn: false,
        monsterAlert: false,
        monsterAttraction: 0,
        monsterChasing: false,
        chaseDistance: CHASE_START_DISTANCE,

        reachedCore: false,
        coreArrivalSafe: false,

        photosDeleted: false,
        videoDeleted: false,
        fullChargeCount: 0
    };

    /* ============ DOM ============ */
    const textBox = document.getElementById('text-box');
    const roomLabel = document.getElementById('room-label');
    const controls = document.getElementById('controls');
    const batteryDisplay = document.getElementById('battery-display');
    const tempDisplay = document.getElementById('temp-display');
    const tempWrap = document.getElementById('temp-stat-wrap');
    const itemDisplay = document.getElementById('item-display');
    const viewport = document.getElementById('game-viewport');
    const topBar = document.getElementById('handheld-phone-bar');
    const invBar = document.getElementById('inventory-bar');

    function killChargeTimer() {
        if (gameState.chargeTimer) { clearInterval(gameState.chargeTimer); gameState.chargeTimer = null; }
    }

    /* ============ 亂碼／重複文字效果 ============ */
    function applyGlitch(text) {
        if (!gameState.corrupted) return text;
        let t = text.replace(/[0-9]/g, '█').replace(/密碼/g, '<span class="glitch-text">N̶u̷l̴l̶</span>');
        const parts = t.split(/\n\n+/);
        if (parts.length > 1 && Math.random() < 0.65) {
            const idx = Math.floor(Math.random() * parts.length);
            parts.splice(idx, 0, parts[idx]);
            t = parts.join('\n\n');
        }
        return t;
    }

    /* ============ 畫面內提示(取代 alert，沙盒環境不支援原生彈窗) ============ */
    function showNote(message, onContinue) {
        killChargeTimer();
        controls.innerHTML = '';
        textBox.innerHTML = applyGlitch(message.replace(/\n/g, '<br>'));
        createButton("▸ 繼續", onContinue || (() => renderRoom(gameState.currentRoom)));
    }

    /* ============ 核心數值更新 ============ */
    function updateStats(battAmount, tempAmount) {
        const prevBattery = gameState.battery;
        gameState.battery = Math.max(0, Math.min(100, gameState.battery + battAmount));
        gameState.temp = Math.max(35.0, Math.min(50.0, gameState.temp + tempAmount));

        if (battAmount > 0 && prevBattery < 100 && gameState.battery >= 100) {
            gameState.fullChargeCount = (gameState.fullChargeCount || 0) + 1;
        }

        if (gameState.temp >= HEAT_THRESHOLD && battAmount === 0 && tempAmount === 0) {
            gameState.battery = Math.max(0, gameState.battery - 1);
        }

        batteryDisplay.textContent = `⚡ ${gameState.battery.toFixed(0)}%`;
        batteryDisplay.className = gameState.battery <= 20 ? 'status-danger' : (gameState.battery <= 50 ? 'status-warn' : 'status-good');

        gameState.corrupted = gameState.temp >= HEAT_THRESHOLD;

        if (!gameState.tempRevealed && gameState.temp >= 40.0 && gameState.currentRoom) {
            gameState.tempRevealed = true;
            tempWrap.classList.remove('stat-hidden');
        }
        if (gameState.tempRevealed) {
            tempDisplay.textContent = `🌡️ ${gameState.temp.toFixed(1)}°C`;
            if (gameState.corrupted) { tempDisplay.className = 'status-danger'; viewport.classList.add('overheat-screen'); }
            else if (gameState.temp >= 40.0) { tempDisplay.className = 'status-warn'; viewport.classList.remove('overheat-screen'); }
            else { tempDisplay.className = 'status-good'; viewport.classList.remove('overheat-screen'); }
        }

        itemDisplay.textContent = gameState.hasIcepack ? '🧊 冰敷包' : '無';

        if (gameState.fullChargeCount >= 3) {
            gameOver("手心一陣突如其來的灼熱感——這已經是第三次，把電量灌到滿格了。\n\n你這才注意到，手機背蓋不知道什麼時候已經微微鼓起，像是隨時會裂開。\n\n『嗶——』一聲悶響，背蓋整個爆開，一陣白煙竄了出來，眼前的畫面碎成一片雪花。\n\n──【BAD END・電池過度膨脹】──");
            return true;
        }

        if (gameState.battery <= 0) {
            gameOver("螢幕的光一格一格地暗下去。\n沒有訊息，沒有提示，什麼都沒有。\n只是，暗了。\n\n──【BAD END・關機】──");
            return true;
        } else if (gameState.temp >= 48.0) {
            gameOver("體溫早已超過負荷。視線被高熱灼燒成一片純白，現實中的鋰電池膨脹爆裂，你的意識被徹底燒毀！\n\n──【BAD END・晶片熔毀】──");
            return true;
        }
        return false;
    }

    /* ============ 通用按鈕(被追擊時，每按一下都算一次行動) ============ */
    function createButton(text, onClick, className = '') {
        const btn = document.createElement('button');
        btn.innerHTML = text;
        btn.className = className;
        btn.onclick = () => {
            if (tickChase()) return;
            onClick();
        };
        controls.appendChild(btn);
        return btn;
    }

    /* 純畫面切換用的按鈕(選樓層、返回上一層選單)：不算一次「行動」，不會被怪物追擊計次 */
    function navButton(text, onClick, className = '') {
        const btn = document.createElement('button');
        btn.innerHTML = text;
        btn.className = className;
        btn.onclick = onClick;
        controls.appendChild(btn);
        return btn;
    }

    function addCodeInput(onSubmit) {
        const wrap = document.createElement('div');
        wrap.style.cssText = 'display:flex;gap:8px;';
        const input = document.createElement('input');
        input.type = 'text';
        input.inputMode = 'numeric';
        input.maxLength = 4;
        input.placeholder = '輸入密碼';
        input.style.cssText = 'flex:1;min-width:0;background:#1a1a1a;color:#00ffcc;border:1px solid #00ffcc;border-radius:6px;padding:11px;font-family:inherit;font-size:16px;';
        const btn = document.createElement('button');
        btn.textContent = '確認';
        btn.style.flex = '0 0 auto';
        btn.onclick = () => { if (tickChase()) return; onSubmit(input.value.trim()); };
        wrap.appendChild(input);
        wrap.appendChild(btn);
        controls.appendChild(wrap);
        return input;
    }

    function addChargeHoldButton(label, battRate, tempRate, opts = {}) {
        const btn = document.createElement('button');
        btn.className = 'btn-charge';
        btn.textContent = label + "(按住充電)";
        btn.tabIndex = 0;

        let seconds = 0, active = false;

        const startCharge = (e) => {
            if (e) e.preventDefault();
            if (active) return;
            if (opts.disabled) { showNote(opts.disabledMessage || "這裡目前無法充電。"); return; }
            if (gameState.breakerTripped && !opts.ignoreBreaker) { showNote("總電源已切斷，插座完全無電！"); return; }
            if (tickChase()) return;
            if (opts.onStart) opts.onStart();
            active = true;
            gameState.chargeTimer = setInterval(() => {
                seconds++;
                if (opts.loose && Math.random() < 0.3 && seconds > 1) {
                    stopCharge();
                    btn.textContent = "⚠️ 線材接觸不良！斷開了！(重新按住)";
                    return;
                }
                // 充電就是在放出電流，效率越高的裝置訊號越大，斷電後失去環境雜訊掩護，訊號會被放大
                if (gameState.monsterBorn && !gameState.monsterChasing) {
                    const gain = battRate * 0.3 * (gameState.breakerTripped ? 2 : 1);
                    const started = accumulateAttraction(gain);
                    if (started) {
                        stopCharge();
                        showNote("【刺耳的雜訊竄過掌心！】黑暗深處，有什麼東西突然停下了動作——它感覺到你了。腳步聲，開始朝這裡靠近。");
                        return;
                    }
                }
                const dead = updateStats(battRate, tempRate);
                if (dead) return;
                if (active) btn.textContent = `⚡ 充電中... (${seconds}s)`;
            }, 500);
        };
        const stopCharge = () => {
            if (!active) return;
            active = false;
            clearInterval(gameState.chargeTimer);
            gameState.chargeTimer = null;
            seconds = 0;
            if (gameState.battery > 0 && gameState.temp < 48.0) btn.textContent = label + "(按住充電)";
            if (opts.onStop) opts.onStop();
        };

        btn.addEventListener('mousedown', startCharge);
        btn.addEventListener('mouseup', stopCharge);
        btn.addEventListener('mouseleave', stopCharge);
        btn.addEventListener('touchstart', startCharge, { passive: false });
        btn.addEventListener('touchend', stopCharge);
        btn.addEventListener('touchcancel', stopCharge);
        btn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') startCharge(e); });
        btn.addEventListener('keyup', (e) => { if (e.key === 'Enter' || e.key === ' ') stopCharge(); });
        btn.addEventListener('blur', stopCharge);

        controls.appendChild(btn);
        return btn;
    }
    document.addEventListener('mouseup', () => { if (gameState.chargeTimer) killChargeTimer(); });

    /* ============ 移動系統：退回走廊(本樓層房間) → 可選前往其他樓層 ============ */
    function chaseBanner() {
        if (!gameState.monsterChasing) { viewport.classList.remove('chase-critical'); return ''; }
        const d = gameState.chaseDistance;
        let msg, danger = false;
        if (d >= 6) msg = '你聽見很輕的腳步聲，在很遠的地方。';
        else if (d >= 4) msg = '腳步聲又近了一些，你分不清它在哪個方向。';
        else if (d >= 2) { msg = '腳步聲清楚了起來——它知道你在哪裡。'; danger = true; }
        else { msg = '⚠️ 它幾乎就在你身後了——再不遠離，下一步就會被追上。'; danger = true; }
        viewport.classList.toggle('chase-critical', d <= 1);
        const html = danger ? `<span class="warning-text">${msg}</span>` : msg;
        return html + '\n\n';
    }

    /* 追逐尚未開始時，累積「牠的注意力」：斷電後會被身上的電量持續放大，平時則會自然衰減 */
    function accumulateAttraction(extraGain = 0) {
        if (!gameState.monsterBorn || gameState.monsterChasing) return false;
        let delta = extraGain;
        if (gameState.breakerTripped) {
            // 斷電後沒有背景雜訊掩護，電量本身就是訊號強度，不再被自然衰減抵銷
            delta += (gameState.battery / 100) * 1.2;
        } else {
            // 燈還亮著、有其他分接頭當掩護時，注意力會慢慢消退
            delta -= MONSTER_ATTRACT_DECAY;
        }
        gameState.monsterAttraction = Math.max(0, Math.min(MONSTER_ATTRACT_MAX, (gameState.monsterAttraction || 0) + delta));

        if (gameState.monsterAttraction >= MONSTER_ATTRACT_ALERT) gameState.monsterAlert = true;

        if (gameState.monsterAttraction >= MONSTER_ATTRACT_CHASE) {
            gameState.monsterChasing = true;
            gameState.chaseDistance = CHASE_START_DISTANCE;
            return true;
        }
        return false;
    }

    function tickChase() {
        if (!gameState.monsterChasing) {
            accumulateAttraction();
            return false;
        }
        gameState.chaseDistance -= 1;
        if (gameState.chaseDistance <= 0) {
            gameOver("黑暗裡，那個「複製出來的自己」終於追上了你。\n它的臉，和你記憶中的自己一模一樣。\n\n它沒有攻擊你，只是伸出手，貼上了你的胸口。\n\n你這才明白，它從來要的不是你的臉、不是你的位置——它要的是你身上的電。\n那是它唯一能活下去的方式。\n\n電量以看得見的速度往它身上流過去，你的視野一格一格暗下來，直到什麼都不剩。\n\n──【BAD END・被抓到了】──");
            return true;
        }
        return false;
    }

    function leaveToCorridor() {
        killChargeTimer();
        const dead = updateStats(-2, 0);
        if (dead) return;
        showCorridor();
    }

    function showCorridor() {
        controls.innerHTML = '';
        const floorId = ROOM_FLOOR[gameState.currentRoom];
        const floor = FLOORS.find(f => f.id === floorId);
        textBox.innerHTML = applyGlitch(`${chaseBanner()}你站在走廊上，${floorId} 還有幾扇門。`);
        roomLabel.textContent = `${floorId}・走廊`;

        floor.rooms.forEach(rid => {
            if (LOCKED_ROOMS.has(rid)) return;
            if (rid === 'B2F-B' && !gameState.doorUnlocked) {
                const btn = createButton(`🔒 ${ROOM_NAME[rid]}`, () => {});
                btn.disabled = true;
                return;
            }
            createButton(ROOM_NAME[rid], () => attemptMove(rid));
        });
        navButton("前往其他樓層", showOtherFloors);
    }

    function showOtherFloors() {
        controls.innerHTML = '';
        textBox.innerHTML = applyGlitch(`${chaseBanner()}要往哪一層走？只能先爬一層，到了那一層才知道有哪些房間。`);
        roomLabel.textContent = '走廊';
        const currentFloorId = ROOM_FLOOR[gameState.currentRoom];
        const currentIdx = FLOORS.findIndex(f => f.id === currentFloorId);
        FLOORS.forEach((floor, idx) => {
            if (floor.id === currentFloorId) return;
            if (Math.abs(idx - currentIdx) !== 1) return;
            navButton(floor.id, () => showFloorRooms(floor));
        });
        navButton("← 返回", showCorridor);
    }

    function showFloorRooms(floor) {
        controls.innerHTML = '';
        textBox.innerHTML = applyGlitch(`${chaseBanner()}${floor.id}`);
        roomLabel.textContent = `${floor.id}・走廊`;
        floor.rooms.forEach(rid => {
            if (LOCKED_ROOMS.has(rid)) return;
            if (rid === 'B2F-B' && !gameState.doorUnlocked) {
                const btn = createButton(`🔒 ${ROOM_NAME[rid]}`, () => {});
                btn.disabled = true;
                return;
            }
            createButton(ROOM_NAME[rid], () => attemptMove(rid));
        });
        navButton("← 返回", showOtherFloors);
    }

    function attemptMove(id, opts = {}) {
        const fromFloorId = ROOM_FLOOR[gameState.currentRoom];
        const toFloorId = ROOM_FLOOR[id];
        const sameFloor = toFloorId === fromFloorId;
        const floorDist = Math.abs(FLOORS.findIndex(f => f.id === fromFloorId) - FLOORS.findIndex(f => f.id === toFloorId));
        let cost = sameFloor ? 3 : 3 + 3 * floorDist; // 每跨一層樓多扣一份電量，樓層差越多耗電越多
        if (opts.viaElevator) cost += 5; // 廢棄升降梯井：跨樓層捷徑，代價極高
        const fromFloor = ROOM_FLOOR[gameState.currentRoom];
        const dead = updateStats(-cost, 0);
        if (dead) return;

        // 真的移動到新房間，等於主動拉開了跟怪物的距離，抵銷掉 tickChase() 剛才扣的那一步
        if (gameState.monsterChasing) {
            gameState.chaseDistance = Math.min(CHASE_START_DISTANCE, gameState.chaseDistance + 1);
        }

        if (fromFloor === '1F' && ROOM_FLOOR[id] !== '1F' && !gameState.monsterBorn) {
            gameState.monsterBorn = true;
            gameState.currentRoom = id;
            controls.innerHTML = '';
            textBox.innerHTML = applyGlitch(`你正要離開這一層樓，身後忽然傳來「唰——唰——」的聲音，\n像是有什麼機器自己動了起來，一張一張地吐出紙。\n\n你沒有回頭看，只聽見很輕的腳步聲，一下、一下，往地下的方向去，漸漸聽不見了。`);
            roomLabel.textContent = '？？？';
            createButton("繼續往前走", () => renderRoom(id));
            return;
        }

        gameState.currentRoom = id;
        renderRoom(id);
    }

        const renderers = {
            '1F-A': renderOffice, '1F-B': renderBreakroom, '1F-C': renderCopyroom,
            '1F-D': renderLobby, '1F-F': renderStoreroom2, '1F-G': renderRestroom, '1F-I': renderManagerOffice,

            'B2F-A': renderElectrical, 'B2F-B': renderCore,
            'B2F-C': renderCoolingroom, 'B2F-D': renderPiperoom, 'B2F-G': renderAlarmroom, 'B2F-H': renderElevatorShaft,
            '2F-A': renderSignal, '2F-B': renderSwitchboard,
            '2F-C': renderBroadcastroom, '2F-D': renderInforoom, '2F-E': renderWiringroom, '2F-F': renderLoungeCorner, '2F-H': renderRelayroom,

        };
        renderers[id]();
        if (gameState.monsterChasing) textBox.innerHTML = applyGlitch(chaseBanner()) + textBox.innerHTML;

    // ---- B2F-B 核心機房 ----
    function allRoomsExplored() {
        return Object.keys(ROOM_NAME).filter(id => !LOCKED_ROOMS.has(id)).every(id => id === '1F-A' || gameState.observed[id]);
    }

    function renderCore() {
        if (!gameState.reachedCore) {
            gameState.reachedCore = true;
            // 電量與體溫全程控制得宜：抵達時電量還夠，且體溫從頭到尾都沒有飆到需要警示的程度
            gameState.coreArrivalSafe = gameState.battery >= 50 && gameState.temp < HEAT_THRESHOLD && !gameState.tempRevealed;
        }
        textBox.innerHTML = `<b>【核心機房・鋰電池膨脹室】</b>\n\n中央懸掛著一顆發燙、嚴重膨脹的巨型鋰電池——那是現實中，那支二手手機的心臟。\n\n主控台的螢幕上跳出一行字：\n<code>偵測到裝置效能低落，是否要恢復原廠設定？</code>`;

        createButton("什麼都不做，靜靜放下手機", () => {
            gameOver("你鬆開了手。\n螢幕的光，一格一格地暗了下去。\n\n──【BAD END・關機】──");
        });

        createButton("選擇「恢復原廠設定」", () => {
            controls.innerHTML = '';
            textBox.innerHTML = applyGlitch(`恢復原廠設定將清除所有內容\n此操作無法復原。是否繼續？`);
            createButton("Y", () => {
                gameOver("進度條緩緩跑到底。\n所有的記憶、所有的照片、所有曾經發生過的事，\n一格一格地，被清空。\n\n手機，變回了出廠時的樣子。\n裡面，什麼人都不在了。\n\n──【BAD END・恢復原廠設定】──");
            });
            createButton("N", () => renderRoom('B2F-B'));
        });

        createButton("查看核心的接口", () => {
            controls.innerHTML = '';
            textBox.innerHTML = `核心外殼上貼著一張褪色的警告標語：高壓，禁止觸碰。線的另一端，還鬆鬆地垂在你手裡。`;
            createButton("把線接上去", () => {
                viewport.style.backgroundColor = '#fff';
                textBox.style.color = '#000';
                const hidden = !gameState.monsterAlert && !gameState.photosDeleted && !gameState.videoDeleted
                    && allRoomsExplored() && gameState.coreArrivalSafe;
                const totalRooms = Object.keys(ROOM_NAME).filter(id => !LOCKED_ROOMS.has(id)).length;
                const exploredRooms = Object.keys(ROOM_NAME).filter(id => !LOCKED_ROOMS.has(id) && (id === '1F-A' || gameState.observed[id])).length;
                const completeness = Math.round((exploredRooms / totalRooms) * 100);
                let recoveryText;
                if (completeness >= 100) {
                    recoveryText = "意識與身體同步恢復的瞬間，你感覺得到每一根手指——你能動，也記得所有事。";
                } else if (completeness >= 75) {
                    recoveryText = "意識醒了過來，身體大部分都能動——只是有些細碎的片段，怎麼想也想不起來。";
                } else if (completeness >= 50) {
                    recoveryText = "意識醒了，眼皮也能微微睜開一條縫，身體卻像灌了鉛一樣，怎麼樣都動不了。";
                } else if (completeness >= 25) {
                    recoveryText = "只有意識恢復了。身體沒有任何反應，你被困在自己一動也不動的軀殼裡，連一根手指都指揮不動。";
                } else {
                    recoveryText = "意識勉強恢復了一絲——但幾乎感覺不到身體的存在，你甚至無法確定，自己是不是真的「回來了」。";
                }
                if (hidden) {
                    gameOver(`你將所有電流注入核心。\n二手手機在現實中爆開火花的瞬間，你感覺不到痛——\n因為你把該記得的，都好好帶著。\n照片還在。聲音還在。你，還是你。\n你徹底脫離了這個狹小的螢幕，完整地。\n\n超頻成功。傳輸完整度 ${completeness}%。\n\n${recoveryText}\n\n──【TRUE END・帶著自己，超頻而去】──`);
                } else {
                    gameOver(`你將所有電流注入核心！現實中的二手手機爆開火花，你徹底脫離了這個狹小的螢幕。\n\n超頻成功。傳輸完整度 ${completeness}%。\n\n${recoveryText}\n\n──【TRUE END・超頻與解脫】──`);
                }
            });
            createButton("先不要", () => renderRoom('B2F-B'));
        });

            if (dead) return;
            if (started) {
                showNote("刺耳的警報聲響徹整棟樓，緊急電力瞬間灌入——但同時，你清楚聽見，黑暗深處的腳步聲，開始朝這裡狂奔而來！", () => renderRoom('B2F-G'));
            } else {
                showNote("警報聲響起的瞬間，緊急電力系統啟動，電量猛地回升不少，體溫也跟著降了下來——但你不確定，這聲音會不會把不該引來的東西，也一起引過來。", () => renderRoom('B2F-G'));
            }
        });
    }

    // ---- B2F-H 廢棄升降梯井 ----
    function renderElevatorShaft() {
        let text = `狹窄的豎井貫穿了好幾層樓，升降梯早已停用，纜繩鬆垮地垂掛著，深不見底的黑暗從下方傳來一陣陣潮濕的風。`;
        if (gameState.monsterBorn) text += `\n\n不知道是不是錯覺，風裡好像夾雜著很輕的、規律的呼吸聲。`;
        textBox.innerHTML = applyGlitch(text);

        createButton("觀察纜繩", () => {
            const dead = updateStats(-1, 0);
            if (dead) return;
            showNote("纜繩表面銹跡斑斑，有些地方已經斷了幾股鋼絲——不知道還能不能承重，但似乎還堪用。", () => renderRoom('B2F-H'));
        });

        createButton("攀著纜繩，跨樓層強行移動", () => {
            controls.innerHTML = '';
            textBox.innerHTML = applyGlitch(`要去哪一層？纜繩很不穩，跨得越遠，耗的電也越多。`);
            const currentFloorId = ROOM_FLOOR[gameState.currentRoom];
            FLOORS.forEach(floor => {
                if (floor.id === currentFloorId) return;
                const target = floor.rooms.find(r => !LOCKED_ROOMS.has(r) && r !== 'B2F-B') || floor.rooms[0];
                navButton(floor.id, () => attemptMove(target, { viaElevator: true }));
            });
            navButton("← 放棄，退回豎井", () => renderRoom('B2F-H'));
        });
    }

    /* ============ 結束處理 ============ */
    function gameOver(message) {
        killChargeTimer();
        gameState.monsterChasing = false;
        viewport.classList.remove('chase-critical');
        textBox.innerHTML = `<span class="warning-text" style="font-size:14.5px;">${message.replace(/\n/g, '<br>')}</span>`;
        roomLabel.textContent = '';
        controls.innerHTML = '';
        const btn = document.createElement('button');
        btn.textContent = "重新載入意識(重新開始)";
        btn.onclick = () => {
            gameState = {
                battery: 60, temp: 36.5, tempRevealed: false, corrupted: false, currentRoom: null, chargeTimer: null, observed: {},
                lightOn: false, hasIcepack: false, icepackTaken: false, antennaTried: false, serverNoteViews: 0, flashlightOn: false,
                doorUnlocked: false, doorCodeKnown: false,
                waterDrinksLeft: 3, drawerUnlocked: false, alarmPulled: false,
                breakerTripped: false, monsterBorn: false, monsterAlert: false, monsterAttraction: 0,
                monsterChasing: false, chaseDistance: CHASE_START_DISTANCE,
                reachedCore: false, coreArrivalSafe: false,
                photosDeleted: false, videoDeleted: false, fullChargeCount: 0
            };
            viewport.classList.remove('light-on', 'overheat-screen', 'chase-critical');
            viewport.style.backgroundColor = '#000';
            textBox.style.color = '#e0e0e0';
            tempWrap.classList.add('stat-hidden');
            showConsent();
        };
        controls.appendChild(btn);
    }

    /* ============ 啟動 ============ */
    function start(saved) {
        if (saved && saved.currentRoom) {
            gameState = Object.assign(gameState, saved);
            topBar.classList.remove('stat-hidden');
            invBar.classList.remove('stat-hidden');
            if (gameState.tempRevealed) tempWrap.classList.remove('stat-hidden');
            viewport.classList.toggle('light-on', gameState.lightOn);
            updateStats(0, 0);
            renderRoom(gameState.currentRoom);
        } else {
            showConsent();
        }
    }
    if (window.claude?.hot) {
        window.claude.hot.snapshot(() => gameState);
        window.claude.hot.ready ? window.claude.hot.ready(start) : start(window.claude.hot.data ?? {});
    } else {
        start(null);
    }
</script>

</body>
</html>
